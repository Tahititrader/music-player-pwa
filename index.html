<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lecteur de musique PRO</title>
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    :root{
      --bg:#0b0b0b; --fg:#f3f3f3; --muted:#9aa0a6; --card:#141414; --accent:#7c3aed;
      --accent-2:#22d3ee; --ring:#3b82f6;
    }
    [data-theme="sunset"]{ --bg:#0b0b12; --card:#101018; --accent:#fb7185; --accent-2:#f59e0b; --ring:#f97316; }
    [data-theme="cyber"]{ --bg:#020617; --card:#0b1020; --accent:#22d3ee; --accent-2:#a3e635; --ring:#06b6d4; }
    [data-theme="midnight"]{ --bg:#050505; --card:#0e0e0e; --accent:#8b5cf6; --accent-2:#06b6d4; --ring:#6366f1; }*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,Roboto,Arial}
.topbar{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,transparent,rgba(255,255,255,.03));backdrop-filter:blur(8px);display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1f2937}
h1{font-size:18px;margin:0}
.muted{color:var(--muted)}
.btn{padding:8px 12px;border:1px solid #30363d;background:#17181b;color:var(--fg);border-radius:12px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#0b0b0b;font-weight:600}
.chip{padding:6px 10px;border-radius:999px;border:1px solid #30363d;background:#0f1115;color:var(--fg)}
.row{display:flex;gap:8px;align-items:center}
.layout{display:grid;grid-template-columns:1fr;gap:12px;padding:12px;max-width:1200px;margin:0 auto}
@media(min-width:980px){.layout{grid-template-columns:2fr 1fr}}
.card{background:var(--card);border:1px solid #1f2937;border-radius:16px;padding:12px}
.queue-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.list{list-style:none;margin:8px 0 0;padding:0;border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid #1f2937}
.item:first-child{border-top:none}
.item.active{outline:1px solid var(--ring);background:rgba(59,130,246,.07)}
.item .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}
.sl{width:100%}
.grid{display:grid;gap:10px}
.eq{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:8px}
.eq .band{display:flex;flex-direction:column;align-items:center}
.eq input{writing-mode:bt-lr;-webkit-appearance:slider-vertical;appearance:slider-vertical;height:120px}
.eq label{font-size:12px;color:var(--muted);margin-top:4px}
.foot{padding:14px;text-align:center;color:var(--muted);border-top:1px solid #1f2937}
#viz{width:100%;height:180px;background:radial-gradient(1200px 300px at 20% -40%,rgba(124,58,237,.25),transparent),
     radial-gradient(800px 280px at 100% 20%,rgba(34,211,238,.18),transparent),
     linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
canvas{display:block;border-radius:12px;border:1px solid #1f2937}
  </style>
</head>
<body data-theme="midnight">
  <header class="topbar">
    <h1>Lecteur PRO — <span class="muted">EQ • Visualizer • Thèmes</span></h1>
    <div class="row" style="gap:6px">
      <button id="pick" class="btn">Importer</button>
      <button id="pick2" class="btn">Importer (mode 2)</button>
      <select id="theme" class="chip">
        <option value="midnight">Midnight</option>
        <option value="sunset">Sunset</option>
        <option value="cyber">Cyber</option>
      </select>
      <select id="vizmode" class="chip">
        <option value="spectrum">Spectrum</option>
        <option value="wave">Waveform</option>
      </select>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <div class="queue-head">
        <h2 style="margin:0">File d'attente <span id="count" class="muted">(0)</span></h2>
        <span class="muted" id="now">—</span>
      </div>
      <canvas id="viz" width="1000" height="200"></canvas>
      <ul id="list" class="list"></ul>
    </section>

    <section class="card">
      <div class="controls">
        <button id="prev" class="btn">⏮</button>
        <button id="play" class="btn primary">▶</button>
        <button id="next" class="btn">⏭</button>
        <button id="shuffle" class="chip">🔀</button>
        <button id="repeat" class="chip">🔁</button>
      </div>

      <div class="grid" style="grid-template-columns:1fr;align-items:center">
        <div class="row" style="gap:10px">
          <span class="muted" id="tcur">0:00</span>
          <input id="seek" type="range" min="0" max="0" step="0.1" value="0" class="sl" />
          <span class="muted" id="tdur">0:00</span>
        </div>
        <div>
          <label class="muted">Volume</label>
          <input id="vol" type="range" min="0" max="1" step="0.01" value="0.9" class="sl" />
        </div>
      </div>

      <hr style="border-color:#1f2937;opacity:.5;margin:12px 0"/>

      <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap">
        <strong>Égaliseur (7 bandes)</strong>
        <div class="row" style="gap:6px">
          <select id="preset" class="chip">
            <option value="flat">Flat</option>
            <option value="bass">Bass Boost</option>
            <option value="treble">Treble Boost</option>
            <option value="vshape">V-Shape</option>
            <option value="vocal">Vocal</option>
          </select>
          <button id="eq-bypass" class="btn">EQ On/Off</button>
        </div>
      </div>
      <div class="eq" id="eq"></div>
    </section>
  </main>

  <footer class="foot">Local only • Aucune pub • Sauvegarde des réglages (thème, preset, gains)</footer>

  <audio id="audio" preload="metadata"></audio>
  <input id="file" type="file" accept="audio/*" multiple hidden />

  <script>
  const $ = (s) => document.querySelector(s);
  const listEl=$('#list'), nowEl=$('#now'), countEl=$('#count');
  const audio=$('#audio'), seek=$('#seek'), tcur=$('#tcur'), tdur=$('#tdur');
  const btnPlay=$('#play'), btnPrev=$('#prev'), btnNext=$('#next');
  const btnPick=$('#pick'), btnPick2=$('#pick2'), btnShuffle=$('#shuffle'), btnRepeat=$('#repeat');
  const fileEl=$('#file'), vol=$('#vol');
  const themeSel=$('#theme'), vizSel=$('#vizmode'), canvas=$('#viz'), ctx=canvas.getContext('2d');

  let tracks=[], index=0, shuffle=false, repeatOne=false;
  let ac, srcNode, masterGain, analyser, eqFilters=[], eqBypass=false;
  const bands=[60,150,400,1000,2500,6000,12000];
  const presets={
    flat:[0,0,0,0,0,0,0],
    bass:[6,4,2,0,-1,-2,-2],
    treble:[-2,-1,0,1,3,5,6],
    vshape:[4,2,0,2,0,2,4],
    vocal:[-2,0,2,4,2,0,-2]
  };

  const fmt=(sec)=>{if(!isFinite(sec))return'0:00';const s=Math.max(0,Math.floor(sec));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};

  function ensureAudioGraph(){
    if(ac) return;
    ac=new (window.AudioContext||window.webkitAudioContext)();
    srcNode=ac.createMediaElementSource(audio);
    masterGain=ac.createGain();
    analyser=ac.createAnalyser();
    analyser.fftSize=2048;
    eqFilters=bands.map(freq=>{
      const f=ac.createBiquadFilter(); f.type='peaking'; f.frequency.value=freq; f.Q.value=1.0; f.gain.value=0; return f;
    });
    let node=srcNode;
    eqFilters.forEach(f=>{ node.connect(f); node=f; });
    node.connect(masterGain); masterGain.connect(analyser); analyser.connect(ac.destination);
  }

  function setEQGains(gains){ eqFilters.forEach((f,i)=>{ f.gain.value=gains[i]||0; }); saveSettings(); }

  function toggleEQBypass(){
    eqBypass=!eqBypass;
    if(!ac) return;
    srcNode.disconnect();
    eqFilters.forEach(f=>{ try{ f.disconnect(); }catch(e){} });
    masterGain.disconnect(); analyser.disconnect();
    if(eqBypass){ srcNode.connect(masterGain); }
    else{ let node=srcNode; eqFilters.forEach(f=>{ node.connect(f); node=f; }); node.connect(masterGain); }
    masterGain.connect(analyser); analyser.connect(ac.destination);
    $('#eq-bypass').classList.toggle('primary',!eqBypass);
  }

  const specAnalyser=()=>{ if(!analyser)return; analyser.fftSize=1024; const buf=new Uint8Array(analyser.frequencyBinCount);
    const w=canvas.width,h=canvas.height; ctx.clearRect(0,0,w,h);
    const grad=ctx.createLinearGradient(0,0,w,0); grad.addColorStop(0,'#7c3aed'); grad.addColorStop(1,'#22d3ee'); ctx.fillStyle=grad;
    analyser.getByteFrequencyData(buf);
    const bw=w/buf.length*2.2; let x=0; for(let i=0;i<buf.length;i++){ const bh=buf[i]/255*h; ctx.fillRect(x,h-bh,bw,Math.max(2,bh)); x+=bw+0.5; }
  };
  const waveAnalyser=()=>{ if(!analyser)return; analyser.fftSize=2048; const buf=new Uint8Array(analyser.fftSize);
    const w=canvas.width,h=canvas.height; ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2; ctx.beginPath();
    analyser.getByteTimeDomainData(buf);
    for(let i=0;i<buf.length;i++){ const y=buf[i]/128*h/2; const x=i*w/buf.length; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke();
  };
  let rafId;
  function loop(){ cancelAnimationFrame(rafId); const draw=vizSel.value==='wave'?waveAnalyser:specAnalyser; const tick=()=>{ draw(); rafId=requestAnimationFrame(tick); }; tick(); }

  function renderList(){ countEl.textContent=`(${tracks.length})`; listEl.innerHTML='';
    tracks.forEach((t,i)=>{ const li=document.createElement('li'); li.className='item'+(i===index?' active':'');
      li.innerHTML=`<button class="title" data-i="${i}">${i===index?'▶ ':''}${t.name}</button><button class="btn" data-del="${i}">✕</button>`; listEl.appendChild(li); }); }

  function setTrack(i){ if(!tracks[i])return; index=i; audio.src=tracks[i].url; nowEl.textContent=tracks[i].name; renderList(); if(!audio.paused) audio.play(); saveSession(); }
  function next(){ if(!tracks.length)return; if(shuffle&&tracks.length>1){ let n=index; while(n===index) n=Math.floor(Math.random()*tracks.length); setTrack(n); } else setTrack((index+1)%tracks.length); }
  function prev(){ if(!tracks.length)return; setTrack((index-1+tracks.length)%tracks.length); }

  function addFileList(fileList){ const files=Array.from(fileList||[]); const allowed=/\.(mp3|m4a|aac|flac|wav|ogg|oga)$/i;
    const aud=files.filter(f=>(f.type&&f.type.startsWith('audio'))||allowed.test(f.name));
    if(!aud.length){alert('Aucun fichier audio reconnu.');return;}
    const mapped=aud.map((f,i)=>({ id:`${Date.now()}_${i}`, name:f.name.replace(/\.[^.]+$/,''), url:URL.createObjectURL(f) }));
    tracks=tracks.concat(mapped); renderList(); if(tracks.length&&!audio.src) setTrack(0); saveSession(); }

  document.addEventListener('click',(e)=>{
    const id=e.target.id, i=e.target.getAttribute('data-i'), del=e.target.getAttribute('data-del');
    if(id==='play'){ audio.paused?audio.play():audio.pause(); }
    if(id==='next') next(); if(id==='prev') prev();
    if(id==='shuffle'){ shuffle=!shuffle; e.target.classList.toggle('primary',shuffle); saveSettings(); }
    if(id==='repeat'){ repeatOne=!repeatOne; e.target.classList.toggle('primary',repeatOne); saveSettings(); }
    if(i!==null) setTrack(parseInt(i));
    if(del!==null){ const di=parseInt(del); const was=di===index; tracks.splice(di,1);
      if(!tracks.length){ audio.pause(); audio.removeAttribute('src'); nowEl.textContent='—'; }
      else if(was){ index=Math.min(index,tracks.length-1); setTrack(index); } renderList(); saveSession(); }
  });

  btnPick.onclick=()=>fileEl.click();
  fileEl.onchange=(e)=>addFileList(e.target.files);
  btnPick2.onclick=async()=>{
    if(!window.showOpenFilePicker){alert("Mode 2 non supporté");return;}
    try{ const handles=await window.showOpenFilePicker({multiple:true,types:[{description:'Audio',accept:{'audio/*':['.mp3','.m4a','.aac','.flac','.wav','.ogg','.oga']}}]});
      const files=[]; for(const h of handles) files.push(await h.getFile()); addFileList(files);}catch(e){}
  };

  vol.oninput=(e)=>{ ensureAudioGraph(); masterGain.gain.value=parseFloat(e.target.value); saveSettings(); };
  seek.oninput=(e)=>audio.currentTime=parseFloat(e.target.value);
  audio.onplay=()=>{ btnPlay.textContent='⏸'; ensureAudioGraph(); loop(); };
  audio.onpause=()=>{ btnPlay.textContent='▶'; };
  audio.onended=()=>{ repeatOne?(audio.currentTime=0,audio.play()):next(); };
  audio.ontimeupdate=()=>{ seek.max=audio.duration||0; seek.value=audio.currentTime; tcur.textContent=fmt(audio.currentTime); tdur.textContent=fmt(audio.duration); };
  themeSel.onchange=()=>{ document.body.setAttribute('data-theme',themeSel.value); saveSettings(); };
  vizSel.onchange=()=>{ loop(); saveSettings(); };

  function buildEqUi(){ const eq=$('#eq'); eq.innerHTML=''; bands.forEach((f,i)=>{
    const wrap=document.createElement('div'); wrap.className='band';
    const inp=document.createElement('input'); inp.type='range'; inp.min=-12; inp.max=12; inp.step=0.1; inp.value=loadSettings().gains?.[i]??0;
    inp.oninput=(e)=>{ ensureAudioGraph(); eqFilters[i].gain.value=parseFloat(e.target.value); saveSettings(); };
    const lab=document.createElement('label'); lab.textContent=f>=1000?(f/1000)+'k':f;
    wrap.appendChild(inp); wrap.appendChild(lab); eq.appendChild(wrap); }); }

  $('#preset').onchange=(e)=>{ const gains=presets[e.target.value]||presets.flat; setEQGains(gains);
    [...document.querySelectorAll('#eq input[type="range"]')].forEach((sl,i)=>sl.value=gains[i]); };
  $('#eq-bypass').onclick=()=>toggleEQBypass();

  function saveSettings(){ const gains=eqFilters.map(f=>+f.gain.value||0);
    localStorage.setItem('pwaMusic.settings',JSON.stringify({theme:themeSel.value,viz:vizSel.value,shuffle,repeatOne,vol:masterGain?masterGain.gain.value:parseFloat(vol.value),gains,eqBypass})); }
  function loadSettings(){ try{return JSON.parse(localStorage.getItem('pwaMusic.settings')||'{}');}catch{return{};} }
  function applySettings(){ const s=loadSettings();
    if(s.theme){themeSel.value=s.theme;document.body.setAttribute('data-theme',s.theme);}
    if(s.viz) vizSel.value=s.viz;
    if(typeof s.vol==='number') vol.value=s.vol;
    if(s.shuffle){shuffle=true;btnShuffle.classList.add('primary');}
    if(s.repeatOne){repeatOne=true;btnRepeat.classList.add('primary');}
    if(Array.isArray(s.gains)&&s.gains.length===bands.length){ setEQGains(s.gains); [...document.querySelectorAll('#eq input[type="range"]')].forEach((sl,i)=>sl.value=s.gains[i]); }
    if(s.eqBypass){eqBypass=false;toggleEQBypass();} }
  function saveSession(){ localStorage.setItem('pwaMusic.session',JSON.stringify({index,tracks:tracks.map(t=>({name:t.name}))})); }

  buildEqUi(); applySettings();
  window.addEventListener('resize',()=>{ canvas.width=canvas.clientWidth*2; canvas.height=200; });
  canvas.width=canvas.clientWidth*2; canvas.height=200;
  document.addEventListener('keydown',(e)=>{ const k=e.key.toLowerCase();
    if(k===' '){e.preventDefault();audio.paused?audio.play():audio.pause();}
    if(k==='arrowright') audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5);
    if(k==='arrowleft') audio.currentTime=Math.max(0,audio.currentTime-5); });

  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>

<!-- === IA PANEL === -->
<script>
(function(){
  const css=document.createElement('style'); css.textContent=`
  .ai-btn{position:fixed;right:16px;bottom:16px;z-index:50;padding:12px 14px;border-radius:12px;border:1px solid #333;background:#17181b;color:#fff;cursor:pointer}
  .ai-panel{position:fixed;right:16px;bottom:72px;z-index:49;width:min(520px,96vw);max-height:80vh;display:none;flex-direction:column;gap:8px;background:#0f1115;border:1px solid #30363d;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .ai-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #1f2937}
  .ai-body{display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:10px 12px}
  .ai-row{display:flex;gap:8px;align-items:center}
  .ai-row input,.ai-row select{flex:1;padding:8px;border-radius:10px;border:1px solid #30363d;background:#0b0d11;color:#fff}
  .ai-text{min-height:72px;max-height:180px;padding:8px;border-radius:10px;border:1px solid #30363d;background:#0b0d11;color:#fff;resize:vertical;width:100%}
  .ai-log{overflow:auto;padding:8px;border-radius:10px;border:1px solid #30363d;background:#0b0d11;color:#e5e7eb;min-height:120px;max-height:300px;white-space:pre-wrap;font-size:13px}
  .ai-actions{display:flex;gap:8px;justify-content:flex-end}
  .ai-actions button{padding:8px 12px;border-radius:10px;border:1px solid #30363d;background:#17181b;color:#fff;cursor:pointer}
  .ai-actions .primary{background:linear-gradient(135deg,#7c3aed,#22d3ee);border:none;color:#0b0b0b;font-weight:600}
  `; document.head.appendChild(css);

  const panel=document.createElement('div'); panel.className='ai-panel';
  panel.innerHTML=`
    <div class="ai-header">
      <strong>Agent IA — Chat &amp; Génération</strong>
      <div class="ai-row" style="gap:6px">
        <select id="ai-provider">
          <option value="openai">ChatGPT (OpenAI)</option>
          <option value="perplexity">Perplexity</option>
          <option value="gemini">Gemini</option>
          <option value="azure">Azure (Copilot)</option>
          <option value="elevenlabs">ElevenLabs 🎵</option>
        </select>
        <button id="ai-close">✕</button>
      </div>
    </div>
    <div class="ai-body">
      <div class="ai-row" id="row-openai"><input id="ai-openai" placeholder="OpenAI API Key (sk-...)" type="password"/></div>
      <div class="ai-row" id="row-perp" style="display:none"><input id="ai-perplexity" placeholder="Perplexity API Key (pplx-...)" type="password"/></div>
      <div class="ai-row" id="row-gem"  style="display:none"><input id="ai-gemini" placeholder="Gemini API Key (AI...)" type="password"/></div>
      <div class="ai-row" id="row-azure" style="display:none">
        <input id="ai-azure-url" placeholder="Azure Base URL"/>
        <input id="ai-azure-key" placeholder="Azure Key" type="password"/>
        <input id="ai-azure-deploy" placeholder="Deployment name"/>
      </div>
      <div class="ai-row" id="row-eleven" style="display:none">
        <input id="ai-eleven" placeholder="ElevenLabs API Key (sk_...)" type="password" style="flex:1"/>
        <input id="ai-eleven-dur" type="number" min="5" max="22" step="1" value="22" style="width:55px;flex:none" title="Durée (s)"/>
        <span style="color:#9aa0a6;flex:none;font-size:13px">s max</span>
      </div>
      <textarea id="ai-input" class="ai-text" placeholder="Chat: Génère une playlist 120 BPM, mood focus&#10;ElevenLabs: Ambient lo-fi jazz with soft piano and rain"></textarea>
      <div id="ai-log" class="ai-log"></div>
      <div class="ai-actions">
        <button id="ai-context">Contexte</button>
        <button id="ai-save">Sauver clés</button>
        <button id="ai-send" class="primary">Envoyer</button>
      </div>
    </div>`;

  const btn=document.createElement('button'); btn.className='ai-btn'; btn.textContent='🤖 IA';
  document.body.appendChild(panel); document.body.appendChild(btn);

  const $p=(s)=>panel.querySelector(s);
  const logEl=$p('#ai-log');
  const log=(m)=>{ logEl.textContent+=m+'\n'; logEl.scrollTop=logEl.scrollHeight; };

  const store={
    load(){ try{return JSON.parse(localStorage.getItem('pwaMusic.ai')||'{}');}catch{return{}} },
    save(v){ localStorage.setItem('pwaMusic.ai',JSON.stringify(v)); }
  };
  const state=store.load();
  $p('#ai-provider').value=state.provider||'openai';
  $p('#ai-openai').value=state.openaiKey||'';
  $p('#ai-perplexity').value=state.perplexityKey||'';
  $p('#ai-gemini').value=state.geminiKey||'';
  $p('#ai-azure-url').value=state.azureUrl||'';
  $p('#ai-azure-key').value=state.azureKey||'';
  $p('#ai-azure-deploy').value=state.azureDeploy||'';
  $p('#ai-eleven').value=state.elevenKey||'';

  function showRows(p){
    $p('#row-openai').style.display=(p==='openai')?'':'none';
    $p('#row-perp').style.display=(p==='perplexity')?'':'none';
    $p('#row-gem').style.display=(p==='gemini')?'':'none';
    $p('#row-azure').style.display=(p==='azure')?'':'none';
    $p('#row-eleven').style.display=(p==='elevenlabs')?'':'none';
  }
  showRows($p('#ai-provider').value);

  btn.onclick=()=>panel.style.display=(panel.style.display==='flex')?'none':'flex';
  panel.style.display='none'; panel.style.flexDirection='column';
  $p('#ai-close').onclick=()=>panel.style.display='none';
  $p('#ai-provider').onchange=e=>{ const p=e.target.value; const cur=store.load(); cur.provider=p; store.save(cur); showRows(p); };

  function getCtx(){
    try{
      const now=(document.getElementById('now')?.textContent||'—').trim();
      const count=document.getElementById('count')?.textContent||'(0)';
      const theme=document.body.getAttribute('data-theme')||'midnight';
      const items=Array.from(document.querySelectorAll('#list .item .title')).map(el=>el.textContent.replace(/^▶\s*/,''));
      const gains=[...document.querySelectorAll('#eq input[type="range"]')].map(sl=>Number(sl.value));
      const preset=document.getElementById('preset')?.value||'flat';
      return {now,count,theme,gains,preset,
        shuffleOn:document.getElementById('shuffle')?.classList.contains('primary')||false,
        repeatOn:document.getElementById('repeat')?.classList.contains('primary')||false,
        items:items.slice(0,50)};
    }catch(e){return{error:String(e)}}
  }

  function sysPrompt(){ return 'Tu es un agent IA dans un lecteur de musique local. Propose playlists, presets EQ 7 bandes, transitions BPM/énergie. Réponds en français, concis. Pour une playlist: {"playlist":["titre1",...]}'; }
  function msgs(user){ return [{role:'system',content:sysPrompt()},{role:'user',content:`Contexte: ${JSON.stringify(getCtx()).slice(0,1800)}\n\n${user}`}]; }

  async function callOpenAI(key,messages){
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model:'gpt-4o-mini',messages,temperature:0.3})});
    if(!r.ok) throw new Error('OpenAI '+r.status+': '+await r.text());
    return (await r.json()).choices?.[0]?.message?.content?.trim()||'';
  }
  async function callPerplexity(key,messages){
    const r=await fetch('https://api.perplexity.ai/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model:'sonar-small-chat',messages,temperature:0.2})});
    if(!r.ok) throw new Error('Perplexity '+r.status+': '+await r.text());
    return (await r.json()).choices?.[0]?.message?.content?.trim()||'';
  }
  async function callGemini(key,messages){
    const prompt=messages.map(m=>`${m.role.toUpperCase()}: ${m.content}`).join('\n\n');
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    if(!r.ok) throw new Error('Gemini '+r.status+': '+await r.text());
    return (await r.json()).candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'';
  }
  async function callAzure(base,key,deploy,messages){
    const url=`${base.replace(/\/$/,'')}/openai/deployments/${encodeURIComponent(deploy)}/chat/completions?api-version=2024-06-01`;
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','api-key':key},body:JSON.stringify({messages,temperature:0.3})});
    if(!r.ok) throw new Error('Azure '+r.status+': '+await r.text());
    return (await r.json()).choices?.[0]?.message?.content?.trim()||'';
  }
  async function callElevenLabs(key,prompt,durationSeconds){
    const r=await fetch('https://api.elevenlabs.io/v1/sound-generation',{
      method:'POST',
      headers:{'Content-Type':'application/json','xi-api-key':key},
      body:JSON.stringify({text:prompt,duration_seconds:durationSeconds,prompt_influence:0.3})
    });
    if(!r.ok) throw new Error('ElevenLabs '+r.status+': '+await r.text());
    return r.blob();
  }

  $p('#ai-save').onclick=()=>{
    store.save({
      provider:$p('#ai-provider').value,
      openaiKey:($p('#ai-openai')?.value||'').trim(),
      perplexityKey:($p('#ai-perplexity')?.value||'').trim(),
      geminiKey:($p('#ai-gemini')?.value||'').trim(),
      azureUrl:($p('#ai-azure-url')?.value||'').trim(),
      azureKey:($p('#ai-azure-key')?.value||'').trim(),
      azureDeploy:($p('#ai-azure-deploy')?.value||'').trim(),
      elevenKey:($p('#ai-eleven')?.value||'').trim(),
    });
    log('✅ Clés enregistrées localement.');
  };

  $p('#ai-context').onclick=()=>log('📦 Contexte: '+JSON.stringify(getCtx()));

  $p('#ai-send').onclick=async()=>{
    const text=(panel.querySelector('#ai-input')?.value||'').trim();
    if(!text){log('⛔ Entre un message.');return;}
    log('👤 '+text);
    try{
      const provider=$p('#ai-provider').value;
      const S=store.load();
      let out='';
      if(provider==='openai'){
        if(!S.openaiKey) throw new Error('Ajoute ta clé OpenAI.');
        out=await callOpenAI(S.openaiKey,msgs(text));
      }else if(provider==='perplexity'){
        if(!S.perplexityKey) throw new Error('Ajoute ta clé Perplexity.');
        out=await callPerplexity(S.perplexityKey,msgs(text));
      }else if(provider==='gemini'){
        if(!S.geminiKey) throw new Error('Ajoute ta clé Gemini.');
        out=await callGemini(S.geminiKey,msgs(text));
      }else if(provider==='azure'){
        if(!S.azureUrl||!S.azureKey||!S.azureDeploy) throw new Error('Renseigne URL/Key/Deployment Azure.');
        out=await callAzure(S.azureUrl,S.azureKey,S.azureDeploy,msgs(text));
      }else if(provider==='elevenlabs'){
        if(!S.elevenKey) throw new Error('Ajoute ta clé ElevenLabs puis clique "Sauver clés".');
        const dur=Math.min(22,Math.max(5,parseInt($p('#ai-eleven-dur')?.value||'22')||22));
        log('🎵 Génération ElevenLabs… (~'+dur+'s, patiente)');
        const blob=await callElevenLabs(S.elevenKey,text,dur);
        const safeName=text.slice(0,40).replace(/[/\\?%*:|"<>]/g,'-');
        const file=new File([blob],'IA — '+safeName+'.mp3',{type:'audio/mpeg'});
        addFileList([file]);
        log('✅ Piste ajoutée: '+file.name.replace(/\.[^.]+$/,''));
      }
      if(out){
        log('🤖 '+out);
        try{ const m=out.match(/\{\s*"playlist"[\s\S]*\}/); if(m){ const j=JSON.parse(m[0]); if(Array.isArray(j.playlist)) log('🎵 Playlist: '+j.playlist.join(' | ')); } }catch{}
      }
    }catch(e){ log('❌ '+e.message); }
  };
})();
</script>
