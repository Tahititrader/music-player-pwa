<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#07070f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.35"/>
  <g filter="url(#glow)" fill="url(#accent)">
    <rect x="267" y="164" width="22" height="124" rx="11"/>
    <ellipse cx="245" cy="288" rx="38" ry="27" transform="rotate(-15 245 288)"/>
    <rect x="316" y="148" width="22" height="108" rx="11"/>
    <ellipse cx="294" cy="256" rx="38" ry="27" transform="rotate(-15 294 256)"/>
    <rect x="267" y="164" width="71" height="20" rx="9"/>
  </g>
  <text x="256" y="400" font-family="'Space Grotesk',system-ui,sans-serif" font-size="48" font-weight="700" fill="url(#accent)" text-anchor="middle" letter-spacing="6" opacity="0.9">MMB</text>
</svg>
